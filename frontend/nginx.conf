server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cabeçalhos de segurança básicos para os arquivos estáticos (a API já
    # aplica os dela via helmet, no Express).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 127.0.0.11 = DNS interno do Docker. Resolver explícito + variável no
    # proxy_pass (em vez de um host fixo) faz o nginx resolver "backend" a
    # cada requisição, não uma vez só ao subir. Sem isso, o nginx: (a) se
    # recusa a iniciar caso o container do backend ainda não esteja
    # resolvível no exato instante em que o nginx sobe, e (b) fica preso no
    # IP antigo se o container do backend for recriado depois (deploy,
    # restart) — confirmado localmente: com host fixo, `nginx -t` falhava
    # com "host not found in upstream" sempre que o backend não estava de
    # pé no mesmo segundo.
    resolver 127.0.0.11 valid=30s;

    # Front e API no mesmo host/porta em produção — elimina CORS
    # cross-origin e deixa o cookie httpOnly de sessão same-site "de
    # verdade" (sem depender de configuração extra de domínio).
    location /api/ {
        set $backend_upstream http://backend:3003;
        # $request_uri preserva o caminho (e a query string) originais —
        # com variável no destino, o proxy_pass NÃO reaplica o restante do
        # URI da location automaticamente (só usa o texto literal depois da
        # variável), então "/api/auth/login" virava só "/api/" no backend.
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        set $backend_upstream http://backend:3003;
        proxy_pass $backend_upstream/health;
    }

    # Assets com hash no nome (Vite) podem ser cacheados por muito tempo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: qualquer rota que não seja arquivo estático cai no index.html
    # (o React Router decide o que renderizar no client).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
